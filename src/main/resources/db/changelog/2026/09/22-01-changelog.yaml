databaseChangeLog:

  - changeSet:
      id: 1790000000000-1
      author: Марсель
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            tableName: image_assets
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: width
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: height
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: object_key
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: image_assets
            baseColumnNames: profile_id
            referencedTableName: profiles
            referencedColumnNames: id
            constraintName: fk_image_assets_profile
            onDelete: CASCADE
        - createIndex:
            tableName: image_assets
            indexName: idx_image_assets_profile_created
            columns:
              - column:
                  name: profile_id
              - column:
                  name: created_at
                  descending: true
      rollback:
        - dropTable:
            tableName: image_assets
