  - changeSet:
      id: add-pg-trgm-extension-for-text-search
      author: Марсель
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: postgresql
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm;

  - changeSet:
      id: add-fulltext-search-indexes-optional
      author: Марсель
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: postgresql
      changes:
        - sql:
            sql: |
              CREATE INDEX IF NOT EXISTS idx_lore_title_trgm ON lore USING gin(title gin_trgm_ops);
              CREATE INDEX IF NOT EXISTS idx_questions_title_trgm ON questions USING gin(title gin_trgm_ops);
